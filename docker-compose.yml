services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: controlscope
      MYSQL_USER: controlscope
      MYSQL_PASSWORD: controlscope
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33106:3306"
    volumes:
      - controlscope_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  controlscope_mysql: